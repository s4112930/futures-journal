<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="theme-color"
  content="#f4f1eb"
>

<title>期貨交易日誌</title>

<style>

:root{
  --bg:#f4f1eb;
  --card:#ffffff;
  --text:#38424a;
  --muted:#90989c;
  --blue:#839aaa;
  --green:#82988a;
  --red:#b77f7f;
  --border:#e4e0da;
  --soft:#f1f2ef;
  --soft2:#f8f7f4;
  --event:#eeeae2;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:26px 16px 110px;
}

h1{
  margin:0 0 22px;
  font-size:27px;
  font-weight:800;
}

.sub{
  margin-bottom:5px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
}

.card{
  width:100%;
  padding:16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  margin-top:8px;
  font-size:20px;
  font-weight:750;
  line-height:1.4;
}

.green{color:var(--green);}
.red{color:var(--red);}

.section{
  margin-top:28px;
}

.section-title{
  margin-bottom:12px;
  font-size:17px;
  font-weight:750;
}

.field{
  width:100%;
  margin-bottom:16px;
}

label{
  display:block;
  margin:0 0 7px 3px;
  color:var(--muted);
  font-size:13px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:16px;
  outline:none;
}

select{
  height:52px;
}

textarea{
  min-height:95px;
  resize:vertical;
}

.two{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
}

@media(max-width:360px){
  .two{
    grid-template-columns:1fr;
  }
}

.points-box{
  padding:14px;
  margin-bottom:16px;
  background:var(--soft);
  border-radius:14px;
}

.points-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.points-title{
  color:var(--muted);
  font-size:13px;
}

.points-value{
  font-size:19px;
  font-weight:750;
}

.help{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.primary{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-size:16px;
  font-weight:750;
}

.primary:disabled{
  opacity:.55;
}

.sync-box{
  margin-top:18px;
}

.sync-status{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.source-badge{
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  background:#edf0ef;
  border-radius:999px;
  color:#6e7c76;
  font-size:11px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.trade{
  padding:15px;
  margin-bottom:11px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
}

.trade-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.trade-name{
  font-size:16px;
  font-weight:750;
}

.small{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:13px;
}

.detail-item{
  padding:11px;
  background:#f8f8f6;
  border-radius:12px;
  font-size:14px;
}

.detail-item span{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:11px;
}

.delete{
  margin-top:12px;
  padding:0;
  border:0;
  background:none;
  color:var(--red);
  font-size:12px;
}

.ai-info{
  padding:15px;
  background:#edf0ef;
  border-radius:16px;
  font-size:14px;
  line-height:1.8;
}

.analysis-block{
  margin-bottom:14px;
  padding:15px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
}

.analysis-card{
  margin-top:10px;
  padding:14px;
  background:var(--soft2);
  border-radius:13px;
}

.analysis-title{
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
}

.analysis-text{
  font-size:14px;
  line-height:1.75;
}

.product-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.product-row:last-child{
  border-bottom:0;
}

.event-card{
  padding:15px;
  margin-bottom:10px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
}

.event-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.event-name{
  font-size:16px;
  font-weight:750;
}

.event-time{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.event-status{
  padding:5px 8px;
  background:var(--event);
  border-radius:999px;
  font-size:11px;
  white-space:nowrap;
}

.event-countdown{
  margin-top:12px;
  font-size:14px;
  font-weight:650;
}

.event-result{
  margin-top:10px;
  padding:11px;
  background:var(--soft2);
  border-radius:12px;
  font-size:13px;
  line-height:1.6;
}

.empty{
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.hidden{
  display:none;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--border);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}

.nav{
  width:100%;
  max-width:620px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav button{
  padding:10px 3px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:12px;
}

.nav button.active{
  color:var(--blue);
  font-weight:750;
}

</style>
</head>

<body>

<div class="app">

    </div>

  <div class="section">

</section>


<section id="addPage" class="page">

  <div class="sub">NEW TRADE</div>
  <h1>新增交易</h1>

  <div class="card">

    <div class="field">

</section>


<section id="analysisPage" class="page">

  <div class="sub">OBJECTIVE AI REVIEW</div>

  <div class="ai-info">
    AI 只依照已記錄的交易資料進行事後分析，不推測情緒或主觀動機。

</section>


<section id="statsPage" class="page">

<script>

const API =
"https://futures-ai-worker.s4112930.workers.dev";

let trades =
JSON.parse(
  localStorage.getItem("futuresTrades")
) || [];


/* =========================
   重大事件
========================= */

const economicEvents = [
  {
    id:"nfp-2026-09",
    name:"美國非農就業",
    shortName:"非農",
    time:"2026-09-04T20:30:00+08:00",
    reference:"2026 年 8 月",
    actual:null,
    previous:null,
    unit:"K"
  },
  {
    id:"ppi-2026-09",
    name:"美國生產者物價指數",
    shortName:"PPI",
    time:"2026-09-10T20:30:00+08:00",
    reference:"2026 年 8 月",
    actual:null,
    previous:null,
    unit:"%"
  },
  {
    id:"cpi-2026-09",
    name:"美國消費者物價指數",
    shortName:"CPI",
    time:"2026-09-11T20:30:00+08:00",
    reference:"2026 年 8 月",
    actual:null,
    previous:null,
    unit:"%"
  }
];


function renderEconomicEvents(){

  const box =
  document.getElementById(
    "eventList"
  );

  const now =
  new Date();

  box.innerHTML =
  economicEvents
  .map(event => {

    const eventTime =
    new Date(
      event.time
    );

    const diff =
    eventTime - now;

    let status =
    "";

    let countdown =
    "";

    if(diff > 0){

      status =
      "尚未公布";

      countdown =
      formatCountdown(diff);

    }else{

      status =
      "已到公布時間";

      countdown =
      "等待官方數值更新";

    }

    return `
      <div class="event-card">

        <div class="event-head">

          <div>

            <div class="event-name">
              ${escapeHTML(event.shortName)}
            </div>

            <div class="event-time">
              ${escapeHTML(event.name)}
              ・
              ${formatEventTime(eventTime)}
            </div>

            <div class="small">
              資料月份：
              ${escapeHTML(event.reference)}
            </div>

          </div>

          <span class="event-status">
            ${status}
          </span>

        </div>

        <div class="event-countdown">
          ${countdown}
        </div>

        <div class="event-result">

          官方實際值：
          ${
            event.actual !== null
            ? escapeHTML(
                event.actual +
                event.unit
              )
            : "尚未公布"
          }

          <br>

          前值：
          ${
            event.previous !== null
            ? escapeHTML(
                event.previous +
                event.unit
              )
            : "尚未填入"
          }

        </div>

      </div>
    `;

  })
  .join("");

}


function formatCountdown(ms){

  const totalMinutes =
  Math.floor(
    ms / 60000
  );

  const days =
  Math.floor(
    totalMinutes /
    1440
  );

  const hours =
  Math.floor(
    (
      totalMinutes %
      1440
    ) /
    60
  );

  const minutes =
  totalMinutes %
  60;

  if(days > 0){

    return (
      "距離公布還有 " +
      days +
      " 天 " +
      hours +
      " 小時"
    );

  }

  if(hours > 0){

    return (
      "距離公布還有 " +
      hours +
      " 小時 " +
      minutes +
      " 分鐘"
    );

  }

  return (
    "距離公布還有 " +
    Math.max(
      minutes,
      0
    ) +
    " 分鐘"
  );

}


function formatEventTime(d){

  return d.toLocaleString(
    "zh-TW",
    {
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }
  );

}


/* =========================
   原本功能
========================= */

const syncMonth =
document.getElementById("syncMonth");

const productSelect =
document.getElementById("productSelect");

const otherProductBox =
document.getElementById("otherProductBox");

const otherProduct =
document.getElementById("otherProduct");

const direction =
document.getElementById("direction");

const entryTime =
document.getElementById("entryTime");

const exitTime =
document.getElementById("exitTime");

const entryPrice =
document.getElementById("entryPrice");

const exitPrice =
document.getElementById("exitPrice");

const stopLoss =
document.getElementById("stopLoss");

const takeProfit =
document.getElementById("takeProfit");

const quantity =
document.getElementById("quantity");

const fee =
document.getElementById("fee");

const profit =
document.getElementById("profit");

const note =
document.getElementById("note");

const pointsPreview =
document.getElementById("pointsPreview");


function buildMonthOptions(){

  const now =
  new Date();

  for(let i = 0; i < 12; i++){

    const d =
    new Date(
      now.getFullYear(),
      now.getMonth() - i,
      1
    );

    const value =
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(2,"0");

    const option =
    document.createElement("option");

    option.value =
    value;

    option.textContent =
    d.getFullYear() +
    " 年 " +
    (d.getMonth() + 1) +
    " 月";

    syncMonth.appendChild(
      option
    );

  }

}


async function loadIGAccount(){

  const balanceBox =
  document.getElementById(
    "igAccountBalance"
  );

  const availableBox =
  document.getElementById(
    "igAvailableBalance"
  );

  try{

    const response =
    await fetch(
      API +
      "/ig/accounts"
    );

    const data =
    await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        "帳戶資料讀取失敗"
      );
    }

    const accounts =
    Array.isArray(
      data.accounts
    )
    ? data.accounts
    : [];

    if(!accounts.length){
      throw new Error(
        "沒有取得 IG 帳戶"
      );
    }

    const account =
    accounts.find(
      a =>
      a.preferred === true
    )
    ||
    accounts[0];

    const currency =
    account.currency ||
    "USD";

    const balance =
    Number(
      account.balance?.balance
    );

    const available =
    Number(
      account.balance?.available
    );

    balanceBox.innerText =
    Number.isFinite(balance)
    ? money(
        balance,
        currency
      )
    : "資料不足";

    availableBox.innerText =
    Number.isFinite(available)
    ? money(
        available,
        currency
      )
    : "資料不足";

  }catch(error){

    balanceBox.innerText =
    "讀取失敗";

    availableBox.innerText =
    "讀取失敗";

  }

}


function normalizeIGProduct(name){

  const text =
  String(name || "").trim();

  const upper =
  text.toUpperCase();

  if(
    upper.includes("US TECH 100") ||
    upper.includes("NASDAQ 100")
  ){
    return "NQ";
  }

  if(
    upper.includes("WALL STREET") ||
    upper.includes("DOW")
  ){
    return "YM";
  }

  if(
    upper.includes("TAIWAN INDEX") ||
    upper.includes("TAIWAN 50") ||
    text.includes("台灣指數") ||
    text.includes("台指")
  ){
    return "台指";
  }

  if(
    upper.includes("GOLD") ||
    text.includes("黃金")
  ){
    return "黃金";
  }

  if(
    upper.includes("SILVER") ||
    text.includes("白銀")
  ){
    return "白銀";
  }

  if(
    upper.includes("BITCOIN") ||
    upper.includes("BTC")
  ){
    return "BTC";
  }

  return text;

}


function isAllowedProduct(product){

  return [
    "NQ",
    "YM",
    "BTC",
    "台指",
    "黃金",
    "白銀"
  ].includes(product);

}


productSelect.addEventListener(
  "change",
  function(){

    if(
      productSelect.value === "其他"

      otherProductBox
      .classList
      .remove("hidden");

    }else{

      otherProductBox
      .classList
      .add("hidden");

      otherProduct.value =
      "";

    }

  }
);


[
  direction,
  entryPrice,
  exitPrice
].forEach(el => {

  el.addEventListener(
    "input",
    updatePoints
  );

  el.addEventListener(
    "change",
    updatePoints
  );

});


function calculatePointsFromValues(
  tradeDirection,
  entry,
  exit
){

  return tradeDirection === "做多"
  ? exit - entry
  : entry - exit;

}


function calculatePoints(){

  return calculatePointsFromValues(
    direction.value,
    Number(entryPrice.value),
    Number(exitPrice.value)
  );

}


function updatePoints(){

  if(
    entryPrice.value === "" ||
    exitPrice.value === ""
  ){

    pointsPreview.innerText =
    "—";

    return;
  }

  const points =
  calculatePoints();

  pointsPreview.innerText =
  (points > 0 ? "+" : "") +
  formatNumber(points) +
  " 點";

}


function parseManualTime(value){

  if(!value){
    return null;
  }

  const normalized =
  value.trim().replace(/-/g,"/");

  const match =
  normalized.match(
    /^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/
  );

  if(!match){
    return null;
  }

  const d =
  new Date(
    Number(match[1]),
    Number(match[2]) - 1,
    Number(match[3]),
    Number(match[4]),
    Number(match[5])
  );

  return Number.isNaN(
    d.getTime()
  )
  ? null
  : d;

}


function localTimeString(d){

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2,"0") +
    "T" +
    String(
      d.getHours()
    ).padStart(2,"0") +
    ":" +
    String(
      d.getMinutes()
    ).padStart(2,"0")
  );

}


function toStorageTime(value){

  const d =
  parseManualTime(value);

  return d
  ? localTimeString(d)
  : "";

}


function igUtcToLocal(value){

  if(!value){
    return "";
  }

  let text =
  String(value).trim();

  if(
    !text.endsWith("Z") &&
    !/[+-]\d\d:\d\d$/.test(text)
  ){
    text += "Z";
  }

  const d =
  new Date(text);

  return Number.isNaN(
    d.getTime()
  )
  ? ""
  : localTimeString(d);

}


function calculateHoldingMinutes(
  start,
  end
){

  const a =
  new Date(start);

  const b =
  new Date(end);

  if(
    Number.isNaN(a.getTime()) ||
    Number.isNaN(b.getTime())
  ){
    return null;
  }

  const diff =
  b - a;

  return diff < 0
  ? null
  : Math.round(
      diff / 60000
    );

}

  }

    productName === "其他"
  ){

    otherProduct.value.trim();
  }

  );

  toStorageTime(
    exitTime.value
  );

    );

      ),

  });

  render();

}


async function syncIGMonth(){

  const button =
  document.getElementById(
    "igSyncBtn"
  );

  const status =
  document.getElementById(
    "igSyncStatus"
  );

  const [
    year,
    month
  ] =
  syncMonth.value
  .split("-")
  .map(Number);

  const start =
  new Date(
    year,
    month - 1,
    1,
    0,
    0,
    0
  );

  const end =
  new Date(
    year,
    month,
    0,
    23,
    59,
    59
  );

  button.disabled =
  true;

  button.innerText =
  "同步中…";

  try{

    const response =
    await fetch(
      API +
      "/ig/transactions" +
      "?from=" +
      encodeURIComponent(
        start
        .toISOString()
        .slice(0,19)
      ) +
      "&to=" +
      encodeURIComponent(
        end
        .toISOString()
        .slice(0,19)
      )
    );

    const data =
    await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        "同步失敗"
      );
    }

    const raw =
    Array.isArray(
      data.transactions
    )
    ? data.transactions
    : [];

    let imported = 0;
    let duplicate = 0;
    let excluded = 0;

    raw.forEach(item => {

      if(
        !isRealTrade(item)
      ){
        return;
      }

      const product =
      normalizeIGProduct(
        item.instrumentName
      );

      if(
        !isAllowedProduct(product)
      ){
        excluded++;
        return;
      }

      const uniqueId =
      item.reference ||
      createIGFallbackId(item);

      if(
        trades.some(
          t =>
          t.igUniqueId === uniqueId ||
          (
            item.reference &&
            t.igReference ===
            item.reference
          )
        )
      ){
        duplicate++;
        return;
      }

      const converted =
      convertIGTrade(
        item,
        uniqueId
      );

      if(converted){

        trades.push(
          converted
        );

        imported++;

      }

    });

    trades.sort(
      (a,b) =>
      new Date(
        b.exitTime ||
        b.entryTime
      )
      -
      new Date(
        a.exitTime ||
        a.entryTime
      )
    );

    saveTrades();

    render();

    await loadIGAccount();

    status.innerText =
    year +
    " 年 " +
    month +
    " 月同步完成：新增 " +
    imported +
    " 筆，已有 " +
    duplicate +
    " 筆，排除其他商品 " +
    excluded +
    " 筆。";

  }catch(error){

    status.innerText =
    "同步失敗：" +
    error.message;

  }

  button.disabled =
  false;

  button.innerText =
  "同步這個月份";

}


function isRealTrade(item){

  if(
    !item ||
    typeof item !== "object"
  ){
    return false;
  }

  const type =
  String(
    item.transactionType ||
    ""
  ).toUpperCase();

  const excluded = [
    "DIVIDEND",
    "WITH",
    "DEPOSIT",
    "TRANSFER",
    "INTEREST",
    "CHARGE",
    "FEE"
  ];

  if(
    excluded.some(
      x =>
      type.includes(x)
    )
  ){
    return false;
  }

  const open =
  parseIGNumber(
    item.openLevel
  );

  const close =
  parseIGNumber(
    item.closeLevel
  );

  const size =
  parseIGNumber(
    item.size
  );

  return (
    Number.isFinite(open) &&
    Number.isFinite(close) &&
    Number.isFinite(size) &&
    size !== 0
  );

}


function createIGFallbackId(item){

  return [
    item.instrumentName,
    item.openDateUtc,
    item.dateUtc,
    item.openLevel,
    item.closeLevel,
    item.size,
    item.profitAndLoss
  ].join("|");

}


function convertIGTrade(
  item,
  uniqueId
){

  const open =
  parseIGNumber(
    item.openLevel
  );

  const close =
  parseIGNumber(
    item.closeLevel
  );

  const size =
  parseIGNumber(
    item.size
  );

  const entry =
  igUtcToLocal(
    item.openDateUtc
  );

  const exit =
  igUtcToLocal(
    item.dateUtc
  );

  if(
    !entry ||
    !exit
  ){
    return null;
  }

  const tradeDirection =
  size >= 0
  ? "做多"
  : "做空";

  return {
    id:
      Date.now() +
      Math.floor(
        Math.random() *
        1000000
      ),

    source:"ig",

    igUniqueId:
      uniqueId,

    igReference:
      item.reference || "",

    igOriginalProduct:
      item.instrumentName || "",

    product:
      normalizeIGProduct(
        item.instrumentName
      ),

    currency:
      normalizeCurrency(
        item.currency
      ),

    direction:
      tradeDirection,

    entryTime:
      entry,

    exitTime:
      exit,

    entryPrice:
      open,

    exitPrice:
      close,

    stopLoss:"",
    takeProfit:"",

    quantity:
      Math.abs(size),

    fee:0,

    points:
      calculatePointsFromValues(
        tradeDirection,
        open,
        close
      ),

    holdingMinutes:
      calculateHoldingMinutes(
        entry,
        exit
      ),

    profit:
      parseIGProfit(
        item.profitAndLoss
      ),

    note:
      "由 IG Trading 自動匯入",

    aiAnalysis:null
  };

}


function parseIGNumber(value){

  if(
    value === null ||
    value === undefined
  ){
    return NaN;
  }

  const cleaned =
  String(value)
  .replace(/,/g,"")
  .replace(/[^\d+\-.]/g,"")
  .trim();

  return Number(cleaned);

}


function parseIGProfit(value){

  const n =
  parseIGNumber(value);

  return Number.isFinite(n)
  ? n
  : 0;

}


function normalizeCurrency(value){

  const text =
  String(value || "")
  .trim()
  .toUpperCase();

  if(
    text === "$" ||
    text === "US$" ||
    text === "USD"
  ){
    return "USD";
  }

  if(
    text === "NT$" ||
    text === "TWD"
  ){
    return "TWD";
  }

  return text || "USD";

}

function money(
  value,
  currency = "TWD"
){

  const number =
  Number(value) || 0;

  const sign =
  number > 0
  ? "+"
  : number < 0
  ? "-"
  : "";

  const amount =
  Math.abs(number)
  .toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:2
    }
  );

  if(
    currency === "USD"
  ){
    return sign + "US$" + amount;
  }

  if(
    currency === "TWD"
  ){
    return sign + "NT$" + amount;
  }

  return (
    sign +
    currency +
    " " +
    amount
  );

}


function formatNumber(value){

  return Number(value)
  .toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:4
    }
  );

}


function formatTime(value){

  const d =
  new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return value || "未填寫";
  }

  return d.toLocaleString(
    "zh-TW",
    {
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatHolding(t){

  const minutes =
  Number(
    t.holdingMinutes
  );

  if(
    !Number.isFinite(
      minutes
    )
  ){
    return "資料不足";
  }

  if(
    minutes < 60
  ){
    return minutes + " 分鐘";
  }

  const hours =
  Math.floor(
    minutes / 60
  );

  const rest =
  minutes % 60;

  return rest
  ? hours + " 小時 " + rest + " 分鐘"
  : hours + " 小時";

}


function totalsByCurrency(list){

  const result = {};

  list.forEach(t => {

    const currency =
    t.currency ||
    "TWD";

    if(
      result[currency] === undefined
    ){
      result[currency] = 0;
    }

    result[currency] +=
    Number(
      t.profit || 0
    );

  });

  return result;

}


function formatTotals(totals){

  const entries =
  Object.entries(totals);

  if(
    !entries.length
  ){
    return "NT$0";
  }

  return entries
  .map(
    ([currency,value]) =>
    money(
      value,
      currency
    )
  )
  .join(" / ");

}

async function runAIAnalysis(id){

  const trade =
  trades.find(
    t =>
    t.id === id
  );

  if(!trade){
    return;
  }

  const button =
  document.getElementById(
    "btn-" + id
  );

  const box =
  document.getElementById(
    "ai-" + id
  );

  button.disabled =
  true;

  button.innerText =
  "AI 分析中…";

  try{

    const response =
    await fetch(
      API,
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/json"
        },
        body:
          JSON.stringify(
            trade
          )
      }
    );

    const data =
    await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        "AI 分析失敗"
      );
    }

    trade.aiAnalysis =
    data.analysis;

    saveTrades();

    box.innerHTML =
    renderAIResult(
      data.analysis
    );

  }catch(error){

    box.innerHTML =
    '<div class="small red">' +
    escapeHTML(
      error.message
    ) +
    '</div>';

  }

  button.disabled =
  false;

  button.innerText =
  "重新分析";

}

    typeof a !== "object"

    return "資料不足";
  }

  return `
    <div class="analysis-card">
      <div class="analysis-title">交易摘要</div>
      <div class="analysis-text">
        ${escapeHTML(a.summary || "資料不足")}
      </div>
    </div>

    <div class="analysis-card">
      <div class="analysis-title">進場分析</div>
      <div class="analysis-text">
        ${escapeHTML(a.entryAnalysis || "資料不足")}
      </div>
    </div>

    <div class="analysis-card">
      <div class="analysis-title">出場分析</div>
      <div class="analysis-text">
        ${escapeHTML(a.exitAnalysis || "資料不足")}
      </div>
    </div>

    <div class="analysis-card">
      <div class="analysis-title">風險管理</div>
      <div class="analysis-text">
        ${escapeHTML(a.riskManagement || "資料不足")}
      </div>
    </div>

    <div class="analysis-card">
      <div class="analysis-title">客觀結論</div>
      <div class="analysis-text">
        ${escapeHTML(a.objectiveConclusion || "資料不足")}
      </div>
    </div>
  `;

}


function renderAnalysis(){

  const list =
  document.getElementById(
    "analysisList"
  );

  if(!trades.length){

    list.innerHTML =
    '<div class="empty">目前沒有交易資料</div>';

    return;
  }

  list.innerHTML =
  trades.map(t => `
    <div class="analysis-block">

      <div class="trade-name">
        ${escapeHTML(t.product)}
      </div>

      <div class="small">
        ${escapeHTML(t.direction)}
        ・
        ${formatTime(t.entryTime)}

      <button
        id="btn-${t.id}"
        class="primary"
        style="margin-top:14px;"
        onclick="runAIAnalysis(${t.id})"
      >
        ${
          t.aiAnalysis
          ? "重新分析"
          : "AI 客觀分析"
        }
      </button>

      <div id="ai-${t.id}">
        ${
          t.aiAnalysis
          ? renderAIResult(
              t.aiAnalysis
            )
          : ""
        }
      </div>

    </div>
  `).join("");

}


function renderStats(){

  const target =
  document.getElementById(
    "productStats"
  );

  const groups = {};

  trades.forEach(t => {

    const key =
    t.product +
    "|" +
    (
      t.currency ||
      "TWD"
    );

    if(!groups[key]){
      groups[key] = {
        product:t.product,
        currency:
        t.currency || "TWD",
        count:0,
        wins:0,
        pnl:0
      };
    }

    groups[key].count++;

    groups[key].pnl +=
    Number(
      t.profit || 0
    );

    if(
      Number(t.profit) > 0
    ){
      groups[key].wins++;
    }

  });

  target.innerHTML =
  Object
  .values(groups)
  .map(g => {

    const rate =
    Math.round(
      g.wins /
      g.count *
      100
    );

    return `
      <div class="product-row">

        <div>
          <strong>
            ${escapeHTML(g.product)}
          </strong>

          <div class="small">
            ${g.count} 筆・勝率 ${rate}%
          </div>
        </div>

        <strong
          class="${
            g.pnl >= 0
            ? "green"
            : "red"
          }"
        >
          ${
            money(
              g.pnl,
              g.currency
            )
          }
        </strong>

      </div>
    `;

  }).join("");

}


function escapeHTML(value){

  const div =
  document.createElement(
    "div"
  );

  div.innerText =
  String(
    value ?? ""
  );

  return div.innerHTML;

}


function render(){

  renderHome();
  renderAnalysis();
  renderStats();
  renderEconomicEvents();

}


buildMonthOptions();
