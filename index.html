<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="theme-color"
  content="#f4f1eb"
>

<title>期貨交易日誌</title>


<style>

:root{
  --bg:#f4f1eb;
  --card:#ffffff;
  --text:#38424a;
  --muted:#90989c;
  --blue:#7c91a3;
  --green:#83998a;
  --red:#b77f7f;
  --border:#e4e0da;
  --soft:#f1f2ef;
  --soft2:#f8f7f4;
}


*{
  box-sizing:border-box;
}


html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "PingFang TC",
  "Noto Sans TC",
  sans-serif;
}


body{
  min-height:100vh;
}


.app{
  width:100%;
  max-width:620px;

  margin:auto;

  padding:
  26px
  16px
  110px;
}


h1{
  margin:0 0 22px;

  font-size:27px;
  font-weight:800;
}


h3{
  margin:0;
}


.sub{
  margin-bottom:5px;

  color:var(--muted);

  font-size:12px;
  letter-spacing:2px;
}



/* 卡片 */

.card{
  width:100%;

  padding:16px;

  background:var(--card);

  border:1px solid var(--border);
  border-radius:18px;
}



/* 統計 */

.stats{
  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:12px;
}


.stat-label{
  color:var(--muted);
  font-size:13px;
}


.stat-value{
  margin-top:8px;

  font-size:22px;
  font-weight:750;
}


.green{
  color:var(--green);
}


.red{
  color:var(--red);
}



/* 區塊 */

.section{
  margin-top:28px;
}


.section-title{
  margin-bottom:12px;

  font-size:17px;
  font-weight:750;
}



/* 表單 */

.field{
  width:100%;
  margin-bottom:16px;
}


label{
  display:block;

  margin:0 0 7px 3px;

  color:var(--muted);

  font-size:13px;
  font-weight:550;
}


input,
select,
textarea{

  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  border:1px solid var(--border);

  border-radius:13px;

  padding:13px;

  background:#fff;

  color:var(--text);

  font-family:inherit;
  font-size:16px;

  outline:none;
}


select{
  height:52px;
}


textarea{
  min-height:95px;

  resize:vertical;
}



/* 日期時間 */

.time-section{
  width:100%;

  padding:14px;

  margin-bottom:16px;

  background:var(--soft2);

  border-radius:15px;
}


.time-title{
  margin-bottom:12px;

  font-size:15px;
  font-weight:750;
}


.time-field{
  width:100%;
  margin-bottom:10px;
}


.time-field:last-child{
  margin-bottom:0;
}


input[type="date"],
input[type="time"]{

  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  height:48px;

  padding:8px 12px;

  box-sizing:border-box;

  overflow:hidden;

  font-size:16px;

  background:#fff;

  -webkit-appearance:none;
  appearance:none;
}



/* 一般雙欄 */

.two{
  display:grid;

  grid-template-columns:
  minmax(0,1fr)
  minmax(0,1fr);

  gap:10px;
}


@media(max-width:360px){

  .two{
    grid-template-columns:1fr;
  }

}



/* 點數 */

.points-box{

  padding:14px;

  margin-bottom:16px;

  background:var(--soft);

  border-radius:14px;
}


.points-row{

  display:flex;

  justify-content:
  space-between;

  align-items:center;

  gap:15px;
}


.points-title{
  color:var(--muted);

  font-size:13px;
}


.points-value{

  font-size:19px;
  font-weight:750;
}



/* 小提示 */

.help{
  margin-top:6px;

  color:var(--muted);

  font-size:11px;
  line-height:1.6;
}



/* 按鈕 */

button{
  font-family:inherit;
  cursor:pointer;
}


.primary{

  width:100%;

  padding:15px;

  border:0;

  border-radius:14px;

  background:var(--blue);

  color:white;

  font-size:16px;
  font-weight:750;
}


.primary:disabled{
  opacity:.55;
}



/* 頁面 */

.page{
  display:none;
}


.page.active{
  display:block;
}



/* 交易紀錄 */

.trade{

  padding:15px;

  margin-bottom:11px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:17px;
}


.trade-top{

  display:flex;

  justify-content:
  space-between;

  align-items:flex-start;

  gap:12px;
}


.trade-name{

  font-size:16px;
  font-weight:750;
}


.small{

  margin-top:5px;

  color:var(--muted);

  font-size:12px;
  line-height:1.6;
}


.detail-grid{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:8px;

  margin-top:13px;
}


.detail-item{

  padding:11px;

  background:#f8f8f6;

  border-radius:12px;

  font-size:14px;
}


.detail-item span{

  display:block;

  margin-bottom:5px;

  color:var(--muted);

  font-size:11px;
}


.rr{

  margin-top:9px;

  padding:10px;

  background:#f6f5f1;

  border-radius:12px;

  color:var(--muted);

  font-size:12px;
}


.delete{

  margin-top:12px;

  padding:0;

  border:0;

  background:none;

  color:var(--red);

  font-size:12px;
}



/* AI */

.ai-info{

  padding:15px;

  background:#edf0ef;

  border-radius:16px;

  font-size:14px;
  line-height:1.8;
}


.analysis-block{

  margin-bottom:14px;

  padding:15px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:17px;
}


.analysis-card{

  margin-top:10px;

  padding:14px;

  background:var(--soft2);

  border-radius:13px;
}


.analysis-title{

  margin-bottom:7px;

  color:var(--muted);

  font-size:12px;
}


.analysis-text{

  font-size:14px;
  line-height:1.75;
}


.chips{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}


.chip{

  padding:6px 9px;

  background:#e9eeea;

  border-radius:999px;

  color:#647268;

  font-size:12px;
}


.warning{

  background:#f3ebe7;

  color:#8c6b61;
}



/* 績效 */

.product-row{

  display:flex;

  justify-content:
  space-between;

  gap:12px;

  padding:13px 0;

  border-bottom:
  1px solid var(--border);
}


.product-row:last-child{
  border-bottom:0;
}



/* 空白 */

.empty{

  padding:30px 10px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
}



/* 隱藏 */

.hidden{
  display:none;
}



/* 底部選單 */

.bottom{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  background:
  rgba(255,255,255,.96);

  border-top:
  1px solid var(--border);

  padding:
  8px
  8px
  calc(
    8px +
    env(safe-area-inset-bottom)
  );
}


.nav{

  width:100%;
  max-width:620px;

  margin:auto;

  display:grid;

  grid-template-columns:
  repeat(4,1fr);
}


.nav button{

  padding:10px 3px;

  border:0;

  background:none;

  color:var(--muted);

  font-size:12px;
}


.nav button.active{

  color:var(--blue);

  font-weight:750;
}


</style>

</head>


<body>


<div class="app">


<!-- 首頁 -->

<section
  id="homePage"
  class="page active"
>

  <div class="sub">
    MY TRADING JOURNAL
  </div>

  <h1>
    期貨交易日誌
  </h1>


  <div class="stats">

    <div class="card">

      <div class="stat-label">
        總損益
      </div>

      <div
        id="totalProfit"
        class="stat-value"
      >
        NT$0
      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        本月損益
      </div>

      <div
        id="monthProfit"
        class="stat-value"
      >
        NT$0
      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        勝率
      </div>

      <div
        id="winRate"
        class="stat-value"
      >
        0%
      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        交易筆數
      </div>

      <div
        id="tradeCount"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <div class="section">

    <div class="section-title">
      最近交易
    </div>

    <div id="tradeList"></div>

  </div>

</section>



<!-- 新增交易 -->

<section
  id="addPage"
  class="page"
>

  <div class="sub">
    NEW TRADE
  </div>

  <h1>
    新增交易
  </h1>


  <div class="card">


    <!-- 商品 -->

    <div class="field">

      <label>
        操作商品
      </label>

      <select id="productSelect">

        <option value="">
          請選擇商品
        </option>

        <option value="NQ">
          NQ
        </option>

        <option value="YM">
          YM
        </option>

        <option value="BTC">
          BTC
        </option>

        <option value="台指">
          台指
        </option>

        <option value="黃金">
          黃金
        </option>

        <option value="白銀">
          白銀
        </option>

        <option value="其他">
          其他
        </option>

      </select>

    </div>


    <div
      id="otherProductBox"
      class="field hidden"
    >

      <label>
        其他商品名稱
      </label>

      <input
        id="otherProduct"
        placeholder="輸入商品名稱"
      >

    </div>



    <!-- 方向 -->

    <div class="field">

      <label>
        方向
      </label>

      <select id="direction">

        <option value="做多">
          做多
        </option>

        <option value="做空">
          做空
        </option>

      </select>

    </div>



    <!-- 進場時間 -->

    <div class="time-section">

      <div class="time-title">
        進場時間
      </div>


      <div class="time-field">

        <label>
          日期
        </label>

        <input
          id="entryDate"
          type="date"
        >

      </div>


      <div class="time-field">

        <label>
          時間
        </label>

        <input
          id="entryClock"
          type="time"
          step="60"
        >

      </div>

    </div>



    <!-- 出場時間 -->

    <div class="time-section">

      <div class="time-title">
        出場時間
      </div>


      <div class="time-field">

        <label>
          日期
        </label>

        <input
          id="exitDate"
          type="date"
        >

      </div>


      <div class="time-field">

        <label>
          時間
        </label>

        <input
          id="exitClock"
          type="time"
          step="60"
        >

      </div>

    </div>



    <!-- 點位 -->

    <div class="two">


      <div class="field">

        <label>
          進場點位
        </label>

        <input
          id="entryPrice"
          type="number"
          step="any"
          inputmode="decimal"
          placeholder="例如 21950"
        >

      </div>


      <div class="field">

        <label>
          出場點位
        </label>

        <input
          id="exitPrice"
          type="number"
          step="any"
          inputmode="decimal"
          placeholder="例如 22150"
        >

      </div>


    </div>



    <!-- 自動點數 -->

    <div class="points-box">

      <div class="points-row">

        <span class="points-title">
          交易點數
        </span>

        <strong
          id="pointsPreview"
          class="points-value"
        >
          —
        </strong>

      </div>

    </div>



    <!-- 停損停利 -->

    <div class="two">


      <div class="field">

        <label>
          停損價
        </label>

        <input
          id="stopLoss"
          type="number"
          step="any"
          inputmode="decimal"
        >

      </div>


      <div class="field">

        <label>
          停利價
        </label>

        <input
          id="takeProfit"
          type="number"
          step="any"
          inputmode="decimal"
        >

      </div>


    </div>



    <!-- 口數成本 -->

    <div class="two">


      <div class="field">

        <label>
          口數
        </label>

        <input
          id="quantity"
          type="number"
          min="1"
          step="1"
          value="1"
        >

      </div>


      <div class="field">

        <label>
          手續費 / 成本
        </label>

        <input
          id="fee"
          type="number"
          min="0"
          step="any"
          inputmode="decimal"
          value="0"
        >

      </div>


    </div>



    <!-- 損益 -->

    <div class="field">

      <label>
        實際獲利 / 虧損金額
      </label>

      <input
        id="profit"
        type="number"
        step="any"
        inputmode="decimal"
        placeholder="獲利輸入 200，虧損輸入 -200"
      >

      <div class="help">
        目前依實際成交結果填寫；之後串接 IG Trading 後可自動取得。
      </div>

    </div>



    <!-- 備註 -->

    <div class="field">

      <label>
        每一單紀錄
      </label>

      <textarea
        id="note"
        placeholder="可記錄進場依據、行情、交易規則或其他可驗證資訊"
      ></textarea>

    </div>



    <button
      class="primary"
      onclick="saveTrade()"
    >
      儲存交易
    </button>


  </div>

</section>



<!-- AI -->

<section
  id="analysisPage"
  class="page"
>

  <div class="sub">
    OBJECTIVE AI REVIEW
  </div>

  <h1>
    AI 客觀分析
  </h1>


  <div class="ai-info">

    <strong>
      分析原則
    </strong>

    <br><br>

    AI 只依照已記錄的交易資料進行事後分析，
    不推測情緒、心理、人格或主觀動機。

    <br><br>

    交易點數與持倉時間由 App 直接計算，
    避免 AI 算術錯誤。

  </div>


  <div class="section">

    <div class="section-title">
      逐筆交易分析
    </div>

    <div id="analysisList"></div>

  </div>

</section>



<!-- 績效 -->

<section
  id="statsPage"
  class="page"
>

  <div class="sub">
    PERFORMANCE
  </div>

  <h1>
    績效統計
  </h1>


  <div class="card">

    <div class="section-title">
      商品別績效
    </div>

    <div id="productStats"></div>

  </div>

</section>


</div>



<!-- 底部選單 -->

<div class="bottom">

  <div class="nav">


    <button
      id="homeBtn"
      class="active"
      onclick="showPage('home')"
    >
      首頁
    </button>


    <button
      id="addBtn"
      onclick="showPage('add')"
    >
      新增交易
    </button>


    <button
      id="analysisBtn"
      onclick="showPage('analysis')"
    >
      AI 分析
    </button>


    <button
      id="statsBtn"
      onclick="showPage('stats')"
    >
      績效
    </button>


  </div>

</div>



<script>


/* =========================
基本設定
========================= */

const AI_API =
"https://futures-ai-worker.s4112930.workers.dev";


let trades =
JSON.parse(
  localStorage.getItem(
    "futuresTrades"
  )
) || [];



/* =========================
DOM
========================= */

const productSelect =
document.getElementById(
  "productSelect"
);


const otherProductBox =
document.getElementById(
  "otherProductBox"
);


const otherProduct =
document.getElementById(
  "otherProduct"
);


const direction =
document.getElementById(
  "direction"
);


const entryDate =
document.getElementById(
  "entryDate"
);


const entryClock =
document.getElementById(
  "entryClock"
);


const exitDate =
document.getElementById(
  "exitDate"
);


const exitClock =
document.getElementById(
  "exitClock"
);


const entryPrice =
document.getElementById(
  "entryPrice"
);


const exitPrice =
document.getElementById(
  "exitPrice"
);


const stopLoss =
document.getElementById(
  "stopLoss"
);


const takeProfit =
document.getElementById(
  "takeProfit"
);


const quantity =
document.getElementById(
  "quantity"
);


const fee =
document.getElementById(
  "fee"
);


const profit =
document.getElementById(
  "profit"
);


const note =
document.getElementById(
  "note"
);


const pointsPreview =
document.getElementById(
  "pointsPreview"
);



/* =========================
商品選擇
========================= */

productSelect.addEventListener(
  "change",
  function(){

    if(
      productSelect.value ===
      "其他"
    ){

      otherProductBox
      .classList
      .remove(
        "hidden"
      );

    }else{

      otherProductBox
      .classList
      .add(
        "hidden"
      );

      otherProduct.value =
      "";

    }

  }
);



/* =========================
點數預覽
========================= */

[
  direction,
  entryPrice,
  exitPrice

].forEach(
  el => {

    el.addEventListener(
      "input",
      updatePoints
    );

    el.addEventListener(
      "change",
      updatePoints
    );

  }
);


function updatePoints(){

  if(
    entryPrice.value === "" ||
    exitPrice.value === ""
  ){

    pointsPreview.innerText =
    "—";

    pointsPreview.className =
    "points-value";

    return;

  }


  const points =
  calculatePoints();


  pointsPreview.innerText =
  (
    points > 0
    ?
    "+"
    :
    ""
  ) +
  formatNumber(points) +
  " 點";


  pointsPreview.className =
  "points-value " +
  (
    points > 0
    ?
    "green"
    :
    points < 0
    ?
    "red"
    :
    ""
  );

}



/* =========================
點數計算
========================= */

function calculatePoints(){

  const entry =
  Number(
    entryPrice.value
  );


  const exit =
  Number(
    exitPrice.value
  );


  if(
    direction.value ===
    "做多"
  ){

    return (
      exit -
      entry
    );

  }


  return (
    entry -
    exit
  );

}



/* =========================
日期時間
========================= */

function combineDateTime(
  date,
  clock
){

  if(
    !date ||
    !clock
  ){

    return "";

  }


  return (
    date +
    "T" +
    clock
  );

}



/* =========================
持倉分鐘
========================= */

function calculateHoldingMinutes(
  start,
  end
){

  if(
    !start ||
    !end
  ){

    return null;

  }


  const startDate =
  new Date(start);


  const endDate =
  new Date(end);


  if(
    Number.isNaN(
      startDate.getTime()
    )
    ||
    Number.isNaN(
      endDate.getTime()
    )
  ){

    return null;

  }


  const diff =
  endDate -
  startDate;


  if(
    diff < 0
  ){

    return null;

  }


  return Math.round(
    diff /
    60000
  );

}



/* =========================
頁面切換
========================= */

function showPage(page){

  document
  .querySelectorAll(
    ".page"
  )
  .forEach(
    x =>
    x.classList.remove(
      "active"
    )
  );


  document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(
    x =>
    x.classList.remove(
      "active"
    )
  );


  const pageElement =
  document.getElementById(
    page +
    "Page"
  );


  const buttonElement =
  document.getElementById(
    page +
    "Btn"
  );


  if(
    pageElement
  ){

    pageElement
    .classList
    .add(
      "active"
    );

  }


  if(
    buttonElement
  ){

    buttonElement
    .classList
    .add(
      "active"
    );

  }

}



/* =========================
新增交易
========================= */

function saveTrade(){

  let productName =
  productSelect.value;


  if(
    !productName
  ){

    alert(
      "請選擇操作商品"
    );

    return;

  }


  if(
    productName ===
    "其他"
  ){

    productName =
    otherProduct
    .value
    .trim();


    if(
      !productName
    ){

      alert(
        "請輸入其他商品名稱"
      );

      return;

    }

  }


  const entryTime =
  combineDateTime(
    entryDate.value,
    entryClock.value
  );


  const exitTime =
  combineDateTime(
    exitDate.value,
    exitClock.value
  );


  if(
    !entryTime
  ){

    alert(
      "請填寫進場日期與時間"
    );

    return;

  }


  if(
    !exitTime
  ){

    alert(
      "請填寫出場日期與時間"
    );

    return;

  }


  if(
    new Date(exitTime) <
    new Date(entryTime)
  ){

    alert(
      "出場時間不能早於進場時間"
    );

    return;

  }


  if(
    entryPrice.value === "" ||
    exitPrice.value === ""
  ){

    alert(
      "請輸入進場與出場點位"
    );

    return;

  }


  if(
    profit.value === ""
  ){

    alert(
      "請輸入實際獲利或虧損金額"
    );

    return;

  }


  const trade = {

    id:
    Date.now(),

    product:
    productName,

    direction:
    direction.value,

    entryTime:
    entryTime,

    exitTime:
    exitTime,

    entryPrice:
    entryPrice.value,

    exitPrice:
    exitPrice.value,

    stopLoss:
    stopLoss.value,

    takeProfit:
    takeProfit.value,

    quantity:
    Number(
      quantity.value ||
      1
    ),

    fee:
    Number(
      fee.value ||
      0
    ),

    points:
    calculatePoints(),

    holdingMinutes:
    calculateHoldingMinutes(
      entryTime,
      exitTime
    ),

    profit:
    Number(
      profit.value
    ),

    note:
    note.value,

    aiAnalysis:
    null

  };


  trades.unshift(
    trade
  );


  saveTrades();

  clearForm();

  render();

  showPage(
    "home"
  );

}

/* =========================
金額格式
========================= */

function money(n){

  const number =
  Number(n) ||
  0;


  const sign =
  number > 0
  ?
  "+"
  :
  number < 0
  ?
  "-"
  :
  "";


  return (
    sign +
    "NT$" +
    Math
    .abs(number)
    .toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits:
        2
      }
    )
  );

}



/* =========================
一般數字
========================= */

function formatNumber(n){

  return Number(n)
  .toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:
      4
    }
  );

}



/* =========================
日期顯示
========================= */

function formatTime(time){

  if(
    !time
  ){

    return "未填寫";

  }


  const d =
  new Date(time);


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return time;

  }


  return d
  .toLocaleString(
    "zh-TW",
    {
      month:
      "2-digit",

      day:
      "2-digit",

      hour:
      "2-digit",

      minute:
      "2-digit"
    }
  );

}



/* =========================
持倉顯示
========================= */

function formatHolding(t){

  let minutes =
  Number(
    t.holdingMinutes
  );


  if(
    !Number.isFinite(
      minutes
    )
  ){

    minutes =
    calculateHoldingMinutes(
      t.entryTime,
      t.exitTime
    );

  }


  if(
    minutes === null ||
    !Number.isFinite(
      minutes
    )
  ){

    return "資料不足";

  }


  if(
    minutes < 60
  ){

    return (
      minutes +
      " 分鐘"
    );

  }


  const hours =
  Math.floor(
    minutes /
    60
  );


  const rest =
  minutes %
  60;


  if(
    rest === 0
  ){

    return (
      hours +
      " 小時"
    );

  }


  return (
    hours +
    " 小時 " +
    rest +
    " 分鐘"
  );

}



/* =========================
風險報酬比
========================= */

function calculateRR(t){

  const entry =
  Number(
    t.entryPrice
  );


  const stop =
  Number(
    t.stopLoss
  );


  const target =
  Number(
    t.takeProfit
  );


  if(
    !entry ||
    !stop ||
    !target
  ){

    return null;

  }


  let risk;

  let reward;


  if(
    t.direction ===
    "做多"
  ){

    risk =
    entry -
    stop;

    reward =
    target -
    entry;

  }else{

    risk =
    stop -
    entry;

    reward =
    entry -
    target;

  }


  if(
    risk <= 0 ||
    reward <= 0
  ){

    return null;

  }


  return (
    reward /
    risk
  );

}

    (
      sum,
      t
    ) =>
    sum +
    Number(
      t.profit ||
      0
    ),
    0
  );

  new Date();


  const monthly =
  trades.filter(
    t => {

      if(
        !t.entryTime
      ){

        return false;

      }


      const d =
      new Date(
        t.entryTime
      );


      if(
        Number.isNaN(
          d.getTime()
        )
      ){

        return false;

      }


      return (
        d.getMonth() ===
        now.getMonth()
        &&
        d.getFullYear() ===
        now.getFullYear()
      );

  );

  monthly.reduce(
    (

      t
    ) =>
    sum +
    Number(

            </span>

/* =========================
AI呼叫
========================= */

async function runAIAnalysis(id){

  const trade =
  trades.find(
    t =>
    t.id ===
    id
  );


  if(
    !trade
  ){

    return;

  }


  const resultBox =
  document.getElementById(
    "ai-" +
    id
  );


  const button =
  document.getElementById(
    "btn-" +
    id
  );


  button.disabled =
  true;


  button.innerText =
  "AI 分析中…";


  resultBox.innerHTML =
  `
  <div class="small">
    正在進行客觀分析，請稍候…
  </div>
  `;


  try{


    const response =
    await fetch(
      AI_API,
      {

        method:
        "POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:
        JSON.stringify(
          trade
        )

      }
    );


    const data =
    await response
    .json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "AI 分析失敗"
      );

    }


    trade.aiAnalysis =
    data.analysis;


    saveTrades();


    resultBox.innerHTML =
    renderAIResult(
      data.analysis,
      trade
    );


    button.disabled =
    false;


    button.innerText =
    "重新分析";


  }catch(error){


    resultBox.innerHTML =
    `
    <div class="small red">

      AI 分析失敗：
      ${escapeHTML(error.message)}

    </div>
    `;


    button.disabled =
    false;


    button.innerText =
    "重新嘗試";

  }

}



/* =========================
AI結果
========================= */

    typeof a !==
    "object"
  ){

    <div class="small red">
      AI 回傳資料格式異常
    </div>
    `;

  const verified =
  Array.isArray(
    a.verifiedFactors
  )
  ?
  a.verifiedFactors
  :
  [];


  const missing =
  Array.isArray(
    a.missingData
  )
  ?
  a.missingData
  :
  [];


  const actualPoints =
  trade &&
  trade.points !==
  undefined
  ?
  (
    formatNumber(
      trade.points
    ) +
    " 點"
  )
  :
  "資料不足";


  return `


  <div class="analysis-card">

    <div class="analysis-title">
      交易摘要
    </div>

    <div class="analysis-text">

      ${escapeHTML(
        a.summary ||
        "資料不足"
      )}

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      持倉時間
    </div>

    <div class="analysis-text">

      ${escapeHTML(
        formatHolding(
          trade
        )
      )}

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      價格變化
    </div>

    <div class="analysis-text">

      ${escapeHTML(
        actualPoints
      )}

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      進場分析
    </div>

    <div class="analysis-text">

      ${escapeHTML(
        a.entryAnalysis ||
        "資料不足"
      )}

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      出場分析
    </div>

    <div class="analysis-text">

      ${escapeHTML(
        a.exitAnalysis ||
        "資料不足"
      )}

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      風險管理
    </div>

    <div class="analysis-text">

      ${escapeHTML(
        a.riskManagement ||
        "資料不足"
      )}

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      可驗證因素
    </div>


    <div class="chips">

      ${
        verified.length
        ?
        verified.map(
          item =>
          `
          <span class="chip">

            ${escapeHTML(item)}

          </span>
          `
        ).join("")
        :
        `
        <span class="chip">

          沒有足夠資料

        </span>
        `
      }

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      資料不足項目
    </div>


    <div class="chips">

      ${
        missing.length
        ?
        missing.map(
          item =>
          `
          <span class="chip warning">

            ${escapeHTML(item)}

          </span>
          `
        ).join("")
        :
        `
        <span class="chip">

          無明顯缺少項目

        </span>
        `
      }

    </div>

  </div>



  <div class="analysis-card">

    <div class="analysis-title">
      客觀結論
    </div>

    <div class="analysis-text">

      ${escapeHTML(
        a.objectiveConclusion ||
        "資料不足"
      )}

    </div>

  </div>


  `;

}

========================= */

            class="${
              Number(t.profit) >=

              ?

        <div class="detail-grid">


          <div class="detail-item">

            </span>

              t.entryPrice ||
              "未填寫"
            }

          </div>


          <div class="detail-item">

            <span>
              出場價
            </span>

            ${

              "未填寫"
            }

/* =========================
績效
========================= */

function renderProductStats(){

  const productStats =
  document.getElementById(
    "productStats"
  );


  if(
    !trades.length
  ){

    productStats.innerHTML =
    `
    <div class="empty">

      目前沒有可統計的交易資料

    </div>
    `;

    return;

  }


  const groups =
  {};


  trades.forEach(
    t => {


      if(
        !groups[
          t.product
        ]
      ){

        groups[
          t.product
        ] =
        {

          count:
          0,

          wins:
          0,

          pnl:
          0

        };

      }


      groups[
        t.product
      ].count++;


      groups[
        t.product
      ].pnl +=
      Number(
        t.profit ||
        0
      );


      if(
        Number(
          t.profit
        ) > 0
      ){

        groups[
          t.product
        ].wins++;

      }

    }
  );


  productStats.innerHTML =
  Object
  .entries(
    groups
  )
  .map(
    (
      [
        name,
        data
      ]
    ) => {


      const rate =
      Math.round(
        data.wins /
        data.count *
        100
      );


      return `


      <div class="product-row">


        <div>

          <strong>

            ${escapeHTML(name)}

          </strong>


          <div class="small">

            ${data.count} 筆

            ・

            勝率 ${rate}%

          </div>

        </div>


        <strong
          class="${
            data.pnl >= 0
            ?
            "green"
            :
            "red"
          }"
        >

          ${money(data.pnl)}

        </strong>


      </div>


      `;

    }
  )
  .join("");

}



/* =========================
安全文字
========================= */

function escapeHTML(text){

  const div =
  document.createElement(
    "div"
  );


  div.innerText =
  String(
    text ??
    ""
  );


  return div.innerHTML;

}



/* =========================
初始化
========================= */

function render(){

  renderHome();

  renderAnalysis();

  renderProductStats();

}


render();
