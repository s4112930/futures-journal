<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="theme-color"
  content="#f4f1eb"
>

<title>期貨交易日誌</title>

<style>

:root{
  --bg:#f4f1eb;
  --card:#ffffff;
  --text:#38424a;
  --muted:#90989c;
  --blue:#839aaa;
  --green:#82988a;
  --red:#b77f7f;
  --border:#e4e0da;
  --soft:#f1f2ef;
  --soft2:#f8f7f4;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "PingFang TC",
  "Noto Sans TC",
  sans-serif;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:26px 16px 110px;
}

h1{
  margin:0 0 22px;
  font-size:27px;
  font-weight:800;
}

.sub{
  margin-bottom:5px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
}

.card{
  width:100%;
  padding:16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  margin-top:8px;
  font-size:20px;
  font-weight:750;
  line-height:1.4;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.section{
  margin-top:28px;
}

.section-title{
  margin-bottom:12px;
  font-size:17px;
  font-weight:750;
}

.field{
  width:100%;
  margin-bottom:16px;
}

label{
  display:block;
  margin:0 0 7px 3px;
  color:var(--muted);
  font-size:13px;
  font-weight:550;
}

input,
select,
textarea{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:16px;
  outline:none;
}

select{
  height:52px;
}

textarea{
  min-height:95px;
  resize:vertical;
}

.time-box{
  margin-bottom:14px;
}

.time-input{
  height:52px;
}

.two{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
}

@media(max-width:360px){

  .two{
    grid-template-columns:1fr;
  }

}

.points-box{
  padding:14px;
  margin-bottom:16px;
  background:var(--soft);
  border-radius:14px;
}

.points-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.points-title{
  color:var(--muted);
  font-size:13px;
}

.points-value{
  font-size:19px;
  font-weight:750;
}

.help{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.primary{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  font-size:16px;
  font-weight:750;
}

.primary:disabled{
  opacity:.55;
}

.secondary{
  width:100%;
  margin-top:9px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  color:var(--muted);
  font-size:13px;
}

.sync-box{
  margin-top:18px;
}

.sync-status{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.source-badge{
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  border-radius:999px;
  background:#edf0ef;
  color:#6e7c76;
  font-size:11px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.trade{
  padding:15px;
  margin-bottom:11px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
}

.trade-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.trade-name{
  font-size:16px;
  font-weight:750;
}

.small{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:13px;
}

.detail-item{
  padding:11px;
  background:#f8f8f6;
  border-radius:12px;
  font-size:14px;
}

.detail-item span{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:11px;
}

.rr{
  margin-top:9px;
  padding:10px;
  background:#f6f5f1;
  border-radius:12px;
  color:var(--muted);
  font-size:12px;
}

.delete{
  margin-top:12px;
  padding:0;
  border:0;
  background:none;
  color:var(--red);
  font-size:12px;
}

.ai-info{
  padding:15px;
  background:#edf0ef;
  border-radius:16px;
  font-size:14px;
  line-height:1.8;
}

.analysis-block{
  margin-bottom:14px;
  padding:15px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
}

.analysis-card{
  margin-top:10px;
  padding:14px;
  background:var(--soft2);
  border-radius:13px;
}

.analysis-title{
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
}

.analysis-text{
  font-size:14px;
  line-height:1.75;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chip{
  padding:6px 9px;
  background:#e9eeea;
  border-radius:999px;
  color:#647268;
  font-size:12px;
}

.warning{
  background:#f3ebe7;
  color:#8c6b61;
}

.product-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.product-row:last-child{
  border-bottom:0;
}

.empty{
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.hidden{
  display:none;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--border);
  padding:
  8px
  8px
  calc(8px + env(safe-area-inset-bottom));
}

.nav{
  width:100%;
  max-width:620px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav button{
  padding:10px 3px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:12px;
}

.nav button.active{
  color:var(--blue);
  font-weight:750;
}

</style>

</head>


<body>

<div class="app">


<section
  id="homePage"
  class="page active"
>

  <div class="sub">
    MY TRADING JOURNAL
  </div>

  <h1>
    期貨交易日誌
  </h1>


  <div class="stats">

    <div class="card">

      <div class="stat-label">
        總損益
      </div>

      <div
        id="totalProfit"
        class="stat-value"
      >
        NT$0
      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        本月損益
      </div>

      <div
        id="monthProfit"
        class="stat-value"
      >
        NT$0
      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        勝率
      </div>

      <div
        id="winRate"
        class="stat-value"
      >
        0%
      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        交易筆數
      </div>

      <div
        id="tradeCount"
        class="stat-value"
      >
        0
      </div>

  </div>


  <div class="sync-box">

    <button

      onclick="syncIGTrades()"
    >

      id="igSyncStatus"

    >
      自動同步最近 30 天的 NQ、YM、BTC、台指、黃金、白銀。

    <div class="section-title">

  </div>

</section>



<section

  class="page"
>

  <div class="sub">

  <div class="card">


    <div class="field">

        操作商品

      <select id="productSelect">

        <option value="">

        </option>

        <option value="YM">

        <option value="BTC">
          BTC

        <option value="黃金">
          黃金

      </select>

    </div>


    <div

    >

      <label>

      <input

        placeholder="輸入商品名稱"
      >

    </div>


    <div class="field">

      <select id="direction">

        <option value="做多">

    <div class="time-box">

      <input

    <div class="points-box">

          id="quantity"

        >

      <div class="field">

        <label>
          手續費 / 成本

<section

>

</section>

  id="statsPage"
  class="page"
>

  <div class="sub">
    PERFORMANCE

    績效統計
  </h1>


  <div class="card">

    <div class="section-title">
      商品別績效
    </div>

    <div id="productStats"></div>

  </div>

</section>

</div>



<div class="bottom">

  <div class="nav">

    <button
      id="homeBtn"

    <button
      id="addBtn"

      新增交易
    </button>

    <button

      onclick="showPage('analysis')"

    <button
      id="statsBtn"
      onclick="showPage('stats')"

<script>

const AI_API =
"https://futures-ai-worker.s4112930.workers.dev";


let trades =
JSON.parse(
  localStorage.getItem(
    "futuresTrades"
  )
) || [];



const productSelect =
document.getElementById(
  "productSelect"
);

const otherProductBox =
document.getElementById(
  "otherProductBox"
);

const otherProduct =
document.getElementById(
  "otherProduct"
);

const direction =
document.getElementById(
  "direction"
);

const entryTime =
document.getElementById(
  "entryTime"
);

const exitTime =
document.getElementById(
  "exitTime"
);

const entryPrice =
document.getElementById(
  "entryPrice"
);

const exitPrice =
document.getElementById(
  "exitPrice"
);

const stopLoss =
document.getElementById(
  "stopLoss"
);

const takeProfit =
document.getElementById(
  "takeProfit"
);

const quantity =
document.getElementById(
  "quantity"
);

const fee =
document.getElementById(
  "fee"
);

const profit =
document.getElementById(
  "profit"
);

const note =
document.getElementById(
  "note"
);

const pointsPreview =
document.getElementById(
  "pointsPreview"
);



/* ==============================
   IG 舊資料自動整理
============================== */

migrateExistingIGTrades();



function migrateExistingIGTrades(){

  let changed = false;

  trades =
  trades.filter(
    t => {

      if(
        t.source !== "ig"
      ){
        return true;
      }

      const originalName =
      t.igOriginalProduct ||
      t.product ||
      "";

      const normalized =
      normalizeIGProduct(
        originalName
      );

      if(
        !isAllowedNormalizedProduct(
          normalized
        )
      ){

        changed = true;
        return false;

      }

      if(
        t.product !==
        normalized
      ){

        t.product =
        normalized;

        changed = true;

      }

      return true;

    }
  );


  if(changed){

    localStorage.setItem(
      "futuresTrades",
      JSON.stringify(
        trades
      )
    );

  }

}



/* ==============================
   表單事件
============================== */

productSelect.addEventListener(
  "change",
  function(){

    if(
      productSelect.value ===
      "其他"
    ){

      otherProductBox
      .classList
      .remove(
        "hidden"
      );

    }else{

      otherProductBox
      .classList
      .add(
        "hidden"
      );

      otherProduct.value =
      "";

    }

  }
);



[
  entryTime,
  exitTime
].forEach(
  el => {

    el.addEventListener(
      "focus",
      function(){

        if(
          !el.value
        ){

          el.value =
          getCurrentTimeText();

        }

      }
    );

  }
);



[
  direction,
  entryPrice,
  exitPrice
].forEach(
  el => {

    el.addEventListener(
      "input",
      updatePoints
    );

    el.addEventListener(
      "change",
      updatePoints
    );

  }
);



function updatePoints(){

  if(
    entryPrice.value === "" ||
    exitPrice.value === ""
  ){

    pointsPreview.innerText =
    "—";

    pointsPreview.className =
    "points-value";

    return;

  }


  const points =
  calculatePoints();


  pointsPreview.innerText =
  (
    points > 0
    ?
    "+"
    :
    ""
  ) +
  formatNumber(points) +
  " 點";


  pointsPreview.className =
  "points-value " +
  (
    points > 0
    ?
    "green"
    :
    points < 0
    ?
    "red"
    :
    ""
  );

}



function calculatePoints(){

  const entry =
  Number(
    entryPrice.value
  );

  const exit =
  Number(
    exitPrice.value
  );


  if(
    direction.value ===
    "做多"
  ){

    return (
      exit -
      entry
    );

  }


  return (
    entry -
    exit
  );

}



/* ==============================
   時間工具
============================== */

function getCurrentTimeText(){

  const d =
  new Date();


  return (
    d.getFullYear() +
    "/" +
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "/" +
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    ) +
    " " +
    String(
      d.getHours()
    ).padStart(
      2,
      "0"
    ) +
    ":" +
    String(
      d.getMinutes()
    ).padStart(
      2,
      "0"
    )
  );

}



function parseTimeText(
  value
){

  if(
    !value
  ){

    return null;

  }


  const normalized =
  value
  .trim()
  .replace(
    /-/g,
    "/"
  );


  const match =
  normalized.match(
    /^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/
  );


  if(
    !match
  ){

    return null;

  }


  const d =
  new Date(
    Number(match[1]),
    Number(match[2]) - 1,
    Number(match[3]),
    Number(match[4]),
    Number(match[5])
  );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return null;

  }


  return d;

}



function localStorageTime(
  d
){

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    ) +
    "T" +
    String(
      d.getHours()
    ).padStart(
      2,
      "0"
    ) +
    ":" +
    String(
      d.getMinutes()
    ).padStart(
      2,
      "0"
    )
  );

}



function toStorageTime(
  value
){

  const d =
  parseTimeText(
    value
  );


  if(
    !d
  ){

    return "";

  }


  return localStorageTime(
    d
  );

}



function calculateHoldingMinutes(
  start,
  end
){

  const startDate =
  new Date(
    start
  );

  const endDate =
  new Date(
    end
  );


  if(
    Number.isNaN(
      startDate.getTime()
    ) ||
    Number.isNaN(
      endDate.getTime()
    )
  ){

    return null;

  }


  const diff =
  endDate -
  startDate;


  if(
    diff < 0
  ){

    return null;

  }


  return Math.round(
    diff /
    60000
  );

}



/* ==============================
   分頁
============================== */

function showPage(
  page
){

  document
  .querySelectorAll(
    ".page"
  )
  .forEach(
    x =>
    x.classList.remove(
      "active"
    )
  );

/* ==============================
   IG 同步
============================== */

async function syncIGTrades(){

  const button =
  document.getElementById(
    "igSyncBtn"
  );

  const status =
  document.getElementById(
    "igSyncStatus"
  );


  button.disabled =
  true;

  button.innerText =
  "同步中…";


  status.innerText =
  "正在讀取 IG 最近 30 天交易紀錄…";


  try{

    const now =
    new Date();

    const from =
    new Date();

    from.setDate(
      from.getDate() -
      30
    );


    const response =
    await fetch(
      AI_API +
      "/ig/transactions" +
      "?from=" +
      encodeURIComponent(
        toIGQueryTime(
          from
        )
      ) +
      "&to=" +
      encodeURIComponent(
        toIGQueryTime(
          now
        )
      )
    );


    const data =
    await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "讀取 IG 交易失敗"
      );

    }


    const raw =
    Array.isArray(
      data.transactions
    )
    ?
    data.transactions
    :
    [];


    let imported =
    0;

    let duplicated =
    0;

    let excluded =
    0;

    let ignored =
    0;


    raw.forEach(
      item => {

        if(
          !isRealIGTrade(
            item
          )
        ){

          ignored++;

          return;

        }


        const product =
        normalizeIGProduct(
          item.instrumentName
        );


        if(
          !isAllowedNormalizedProduct(
            product
          )
        ){

          excluded++;

          return;

        }


        if(
          item.reference &&
          trades.some(
            t =>
            t.igReference ===
            item.reference
          )
        ){

          duplicated++;

          return;

        }


        const converted =
        convertIGTrade(
          item
        );


        if(
          !converted
        ){

          ignored++;

          return;

        }


        trades.push(
          converted
        );


        imported++;

      }
    );


    trades.sort(
      (
        a,
        b
      ) =>
      new Date(
        b.exitTime ||
        b.entryTime
      )
      -
      new Date(
        a.exitTime ||
        a.entryTime
      )
    );


    saveTrades();

    render();


    status.innerText =
    "同步完成：新增 " +
    imported +
    " 筆" +
    "，重複 " +
    duplicated +
    " 筆" +
    "，排除其他商品 " +
    excluded +
    " 筆。";


  }catch(
    error
  ){

    status.innerText =
    "同步失敗：" +
    error.message;

  }


  button.disabled =
  false;

  button.innerText =
  "同步 IG 交易";

}



function toIGQueryTime(
  d
){

  return d
  .toISOString()
  .slice(
    0,
    19
  );

}



/* ==============================
   IG 商品分類
============================== */

function normalizeIGProduct(
  name
){

  const text =
  String(
    name ||
    ""
  )
  .trim();


  const upper =
  text
  .toUpperCase();


  if(
    upper.includes(
      "US TECH 100"
    ) ||
    upper.includes(
      "NASDAQ 100"
    )
  ){

    return "NQ";

  }


  if(
    upper.includes(
      "WALL STREET"
    ) ||
    upper.includes(
      "DOW"
    )
  ){

    return "YM";

  }


  if(
    upper.includes(
      "TAIWAN INDEX"
    ) ||
    upper.includes(
      "TAIWAN 50"
    ) ||
    text.includes(
      "台灣指數"
    ) ||
    text.includes(
      "台指"
    )
  ){

    return "台指";

  }


  if(
    upper.includes(
      "GOLD"
    ) ||
    text.includes(
      "黃金"
    )
  ){

    return "黃金";

  }


  if(
    upper.includes(
      "SILVER"
    ) ||
    text.includes(
      "白銀"
    )
  ){

    return "白銀";

  }


  if(
    upper.includes(
      "BITCOIN"
    ) ||
    upper.includes(
      "BTC"
    )
  ){

    return "BTC";

  }


  return text;

}



function isAllowedNormalizedProduct(
  product
){

  return [
    "NQ",
    "YM",
    "BTC",
    "台指",
    "黃金",
    "白銀"
  ]
  .includes(
    product
  );

}



/* ==============================
   IG 真實交易判斷
============================== */

function isRealIGTrade(
  item
){

  if(
    !item ||
    typeof item !==
    "object"
  ){

    return false;

  }


  const type =
  String(
    item.transactionType ||
    ""
  )
  .toUpperCase();


  const excludedTypes =
  [
    "DIVIDEND",
    "WITH",
    "DEPOSIT",
    "TRANSFER",
    "INTEREST",
    "CHARGE",
    "FEE"
  ];


  if(
    excludedTypes.some(
      x =>
      type.includes(
        x
      )
    )
  ){

    return false;

  }


  const open =
  parseIGNumber(
    item.openLevel
  );


  const close =
  parseIGNumber(
    item.closeLevel
  );


  const size =
  parseIGNumber(
    item.size
  );


  return (
    Number.isFinite(
      open
    ) &&
    Number.isFinite(
      close
    ) &&
    Number.isFinite(
      size
    ) &&
    size !==
    0
  );

}



/* ==============================
   IG → App
============================== */

function convertIGTrade(
  item
){

  const open =
  parseIGNumber(
    item.openLevel
  );


  const close =
  parseIGNumber(
    item.closeLevel
  );


  const signedSize =
  parseIGNumber(
    item.size
  );


  if(
    !Number.isFinite(
      open
    ) ||
    !Number.isFinite(
      close
    ) ||
    !Number.isFinite(
      signedSize
    )
  ){

    return null;

  }


  const tradeDirection =
  signedSize >=
  0
  ?
  "做多"
  :
  "做空";


  const entryStorage =
  igUtcToLocalStorage(
    item.openDateUtc
  );


  const exitStorage =
  igUtcToLocalStorage(
    item.dateUtc
  );


  if(
    !entryStorage ||
    !exitStorage
  ){

    return null;

  }


  const pointMove =
  tradeDirection ===
  "做多"
  ?
  close -
  open
  :
  open -
  close;


  return {

    id:
    Date.now() +
    Math.floor(
      Math.random() *
      1000000
    ),

    source:
    "ig",

    igReference:
    item.reference ||
    "",

    igOriginalProduct:
    item.instrumentName ||
    "",

    currency:
    normalizeCurrency(
      item.currency
    ),

    product:
    normalizeIGProduct(
      item.instrumentName
    ),

    direction:
    tradeDirection,

    entryTime:
    entryStorage,

    exitTime:
    exitStorage,

    entryPrice:
    open,

    exitPrice:
    close,

    stopLoss:
    "",

    takeProfit:
    "",

    quantity:
    Math.abs(
      signedSize
    ),

    fee:
    0,

    points:
    pointMove,

    holdingMinutes:
    calculateHoldingMinutes(
      entryStorage,
      exitStorage
    ),

    profit:
    parseIGProfit(
      item.profitAndLoss
    ),

    note:
    "由 IG Trading 自動匯入",

    aiAnalysis:
    null

  };

}



function parseIGNumber(
  value
){

  if(
    value ===
    null ||
    value ===
    undefined
  ){

    return NaN;

  }


  const cleaned =
  String(
    value
  )
  .replace(
    /,/g,
    ""
  )
  .replace(
    /[^\d+\-.]/g,
    ""
  )
  .trim();


  if(
    !cleaned ||
    cleaned ===
    "+" ||
    cleaned ===
    "-" ||
    cleaned ===
    "."
  ){

    return NaN;

  }


  return Number(
    cleaned
  );

}



function parseIGProfit(
  value
){

  const number =
  parseIGNumber(
    value
  );


  return Number.isFinite(
    number
  )
  ?
  number
  :
  0;

}



function normalizeCurrency(
  value
){

  const currency =
  String(
    value ||
    ""
  )
  .trim()
  .toUpperCase();


  if(
    currency ===
    "$" ||
    currency ===
    "US$"
  ){

    return "USD";

  }


  if(
    currency ===
    "NT$" ||
    currency ===
    "TWD"
  ){

    return "TWD";

  }


  return (
    currency ||
    "USD"
  );

}



function igUtcToLocalStorage(
  value
){

  if(
    !value
  ){

    return "";

  }


  let text =
  String(
    value
  )
  .trim();


  if(
    !text.endsWith(
      "Z"
    ) &&
    !/[+-]\d\d:\d\d$/
    .test(
      text
    )
  ){

    text +=
    "Z";

  }


  const d =
  new Date(
    text
  );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return "";

  }


  return localStorageTime(
    d
  );

}

/* ==============================
   顯示工具
============================== */

function money(
  n,
  currency =
  "TWD"
){

  const number =
  Number(
    n
  ) ||
  0;


  const sign =
  number >
  0
  ?
  "+"
  :
  number <
  0
  ?
  "-"
  :
  "";


  const amount =
  Math.abs(
    number
  )
  .toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:
      2
    }
  );


  if(
    currency ===
    "USD"
  ){

    return (
      sign +
      "US$" +
      amount
    );

  }


  if(
    currency ===
    "TWD"
  ){

    return (
      sign +
      "NT$" +
      amount
    );

  }


  return (
    sign +
    currency +
    " " +
    amount
  );

}



function formatNumber(
  n
){

  return Number(
    n
  )
  .toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:
      4
    }
  );

}



function formatTime(
  time
){

  if(
    !time
  ){

    return "未填寫";

  }


  const d =
  new Date(
    time
  );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return time;

  }


  return d
  .toLocaleString(
    "zh-TW",
    {
      month:
      "2-digit",

      day:
      "2-digit",

      hour:
      "2-digit",

      minute:
      "2-digit"
    }
  );

}



function formatHolding(
  t
){

  let minutes =
  Number(
    t.holdingMinutes
  );


  if(
    !Number.isFinite(
      minutes
    )
  ){

    minutes =
    calculateHoldingMinutes(
      t.entryTime,
      t.exitTime
    );

  }


  if(
    minutes ===
    null ||
    !Number.isFinite(
      minutes
    )
  ){

    return "資料不足";

  }


  if(
    minutes <
    60
  ){

    return (
      minutes +
      " 分鐘"
    );

  }


  const hours =
  Math.floor(
    minutes /
    60
  );


  const rest =
  minutes %
  60;


  if(
    rest ===
    0
  ){

    return (
      hours +
      " 小時"
    );

  }


  return (
    hours +
    " 小時 " +
    rest +
    " 分鐘"
  );

}



/* ==============================
   風險報酬比
============================== */

function calculateRR(
  t
){

  const entry =
  Number(
    t.entryPrice
  );

  const stop =
  Number(
    t.stopLoss
  );

  const target =
  Number(
    t.takeProfit
  );


  if(
    !entry ||
    !stop ||
    !target
  ){

    return null;

  }


  let risk;

  let reward;


  if(
    t.direction ===
    "做多"
  ){

    risk =
    entry -
    stop;

    reward =
    target -
    entry;

  }else{

    risk =
    stop -
    entry;

    reward =
    entry -
    target;

  }


  if(
    risk <=
    0 ||
    reward <=
    0
  ){

    return null;

  }


  return (
    reward /
    risk
  );

}



/* ==============================
   幣別統計
============================== */

function totalsByCurrency(
  list
){

  const totals =
  {};


  list.forEach(
    t => {

      const currency =
      t.currency ||
      "TWD";


      if(
        !totals[
          currency
        ]
      ){

        totals[
          currency
        ] =
        0;

      }


      totals[
        currency
      ] +=
      Number(
        t.profit ||
        0
      );

    }
  );


  return totals;

}



function formatCurrencyTotals(
  totals
){

  const entries =
  Object.entries(
    totals
  );


  if(
    !entries.length
  ){

    return "NT$0";

  }


  return entries
  .map(
    (
      [
        currency,
        value
      ]
    ) =>
    money(
      value,
      currency
    )
  )
  .join(
    " / "
  );

}

  resultBox.innerHTML =
  `
  <div class="small">
    正在進行客觀分析，請稍候…
  </div>
  `;


  try{

    const response =
    await fetch(
      AI_API,
      {

        method:
        "POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:
        JSON.stringify(
          trade
        )

      }
    );


    const data =
    await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "AI 分析失敗"
      );

    }


    trade.aiAnalysis =
    data.analysis;


    saveTrades();


    resultBox.innerHTML =
    renderAIResult(
      data.analysis,
      trade
    );


    button.disabled =
    false;


    button.innerText =
    "重新分析";


  }catch(
    error
  ){

    resultBox.innerHTML =
    `
    <div class="small red">

      AI 分析失敗：
      ${escapeHTML(error.message)}

    </div>
    `;


    button.disabled =
    false;


    button.innerText =
    "重新嘗試";

  }

}



function renderAIResult(
  a,
  trade
){

  if(
    !a ||
    typeof a !==
    "object"
  ){

    return `
    <div class="small red">
      AI 回傳資料格式異常
    </div>
    `;

  }


  const verified =
  Array.isArray(
    a.verifiedFactors
  )
  ?
  a.verifiedFactors
  :
  [];


  const missing =
  Array.isArray(
    a.missingData
  )
  ?
  a.missingData
  :
  [];


  const actualPoints =
  trade.points !==
  undefined
  ?
  formatNumber(
    trade.points
  ) +
  " 點"
  :
  "資料不足";


  return `

  <div class="analysis-card">

    <div class="analysis-title">
      交易摘要
    </div>

    <div class="analysis-text">
      ${escapeHTML(a.summary || "資料不足")}
    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      持倉時間
    </div>

    <div class="analysis-text">
      ${escapeHTML(formatHolding(trade))}
    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      價格變化
    </div>

    <div class="analysis-text">
      ${escapeHTML(actualPoints)}
    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      進場分析
    </div>

    <div class="analysis-text">
      ${escapeHTML(a.entryAnalysis || "資料不足")}
    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      出場分析
    </div>

    <div class="analysis-text">
      ${escapeHTML(a.exitAnalysis || "資料不足")}
    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      風險管理
    </div>

    <div class="analysis-text">
      ${escapeHTML(a.riskManagement || "資料不足")}
    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      可驗證因素
    </div>

    <div class="chips">

      ${
        verified.length
        ?
        verified.map(
          item =>
          `
          <span class="chip">
            ${escapeHTML(item)}
          </span>
          `
        ).join("")
        :
        `
        <span class="chip">
          沒有足夠資料
        </span>
        `
      }

    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      資料不足項目
    </div>

    <div class="chips">

      ${
        missing.length
        ?
        missing.map(
          item =>
          `
          <span class="chip warning">
            ${escapeHTML(item)}
          </span>
          `
        ).join("")
        :
        `
        <span class="chip">
          無明顯缺少項目
        </span>
        `
      }

    </div>

  </div>


  <div class="analysis-card">

    <div class="analysis-title">
      客觀結論
    </div>

    <div class="analysis-text">
      ${escapeHTML(a.objectiveConclusion || "資料不足")}
    </div>

  </div>

  `;

}



/* ==============================
   AI 頁面
============================== */

function renderAnalysis(){

  const analysisList =
  document.getElementById(
    "analysisList"
  );


  if(
    !trades.length
  ){

    analysisList.innerHTML =
    `
    <div class="empty">
      新增交易後才會產生分析
    </div>
    `;

    return;

  }


  analysisList.innerHTML =
  trades.map(
    t => {

      const saved =
      t.aiAnalysis &&
      typeof t.aiAnalysis ===
      "object"
      ?
      renderAIResult(
        t.aiAnalysis,
        t
      )
      :
      `
      <div
        class="small"
        style="margin-top:12px;"
      >
        尚未執行 AI 客觀分析
      </div>
      `;


      return `

      <div class="analysis-block">

        <div class="trade-top">

          <div>

            <div class="trade-name">
              ${escapeHTML(t.product)}
            </div>

            <div class="small">

              ${escapeHTML(t.direction)}

              ・

              ${formatTime(t.entryTime)}

            </div>

            ${
              t.source ===
              "ig"
              ?
              `
              <span class="source-badge">
                IG 自動匯入
              </span>
              `
              :
              ""
            }

          </div>


          <strong
            class="${
              Number(t.profit) >=
              0
              ?
              "green"
              :
              "red"
            }"
          >

            ${
              money(
                t.profit,
                t.currency ||
                "TWD"
              )
            }

          </strong>

        </div>


        <div class="detail-grid">

          <div class="detail-item">

            <span>
              進場價
            </span>

            ${
              t.entryPrice ||
              "未填寫"
            }

          </div>


          <div class="detail-item">

            <span>
              出場價
            </span>

            ${
              t.exitPrice ||
              "未填寫"
            }

          </div>


          <div class="detail-item">

            <span>
              停損價
            </span>

            ${
              t.stopLoss ||
              "未填寫"
            }

          </div>


          <div class="detail-item">

            <span>
              停利價
            </span>

            ${
              t.takeProfit ||
              "未填寫"
            }

          </div>

        </div>


        <button
          id="btn-${t.id}"
          class="primary"
          style="margin-top:14px;"
          onclick="runAIAnalysis(${t.id})"
        >

          ${
            t.aiAnalysis
            ?
            "重新分析"
            :
            "AI 客觀分析"
          }

        </button>


        <div
          id="ai-${t.id}"
        >
          ${saved}
        </div>

      </div>

      `;

    }
  )
  .join("");

}



/* ==============================
   績效
============================== */

function renderProductStats(){

  const productStats =
  document.getElementById(
    "productStats"
  );


  if(
    !trades.length
  ){

    productStats.innerHTML =
    `
    <div class="empty">
      目前沒有可統計的交易資料
    </div>
    `;

    return;

  }


  const groups =
  {};


  trades.forEach(
    t => {

      const key =
      t.product +
      "||" +
      (
        t.currency ||
        "TWD"
      );


      if(
        !groups[
          key
        ]
      ){

        groups[
          key
        ] =
        {
          name:
          t.product,

          currency:
          t.currency ||
          "TWD",

          count:
          0,

          wins:
          0,

          pnl:
          0
        };

      }


      groups[
        key
      ].count++;


      groups[
        key
      ].pnl +=
      Number(
        t.profit ||
        0
      );


      if(
        Number(
          t.profit
        ) >
        0
      ){

        groups[
          key
        ].wins++;

      }

    }
  );


  productStats.innerHTML =
  Object
  .values(
    groups
  )
  .map(
    data => {

      const rate =
      Math.round(
        data.wins /
        data.count *
        100
      );


      return `

      <div class="product-row">

        <div>

          <strong>
            ${escapeHTML(data.name)}
          </strong>

          <div class="small">

            ${data.count} 筆

            ・

            勝率 ${rate}%

          </div>

        </div>


        <strong
          class="${
            data.pnl >=
            0
            ?
            "green"
            :
            "red"
          }"
        >

          ${
            money(
              data.pnl,
              data.currency
            )
          }

        </strong>

      </div>

      `;

    }
  )
  .join("");

}



/* ==============================
   HTML 安全
============================== */

function escapeHTML(
  text
){

  const div =
  document.createElement(
    "div"
  );


  div.innerText =
  String(
    text ??
    ""
  );


  return div.innerHTML;

}



/* ==============================
   Render
============================== */

function render(){

  renderHome();

  renderAnalysis();

  renderProductStats();

}


render();

</script>
